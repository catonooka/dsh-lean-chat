<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>dsh-lean-chat bridge</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 6px 8px; box-sizing: border-box; font: inherit; }
    button { margin-top: 12px; padding: 6px 16px; font: inherit; cursor: pointer; }
    #status { margin-top: 10px; min-height: 1em; color: #1a7f37; }
    p.hint { color: #59636e; font-size: 13px; }
  </style>
</head>
<body>
  <h1>dsh-lean-chat bridge</h1>
  <p class="hint">This extension runs the chat app's searches in this browser, using its cookies.
    Point it at the address the app prints on startup.</p>
  <label for="origin">Chat app origin</label>
  <input id="origin" type="url" spellcheck="false" placeholder="http://127.0.0.1:3095">
  <button id="save">Save</button>
  <div id="status" role="status"></div>
  <script src="options.js"></script>
</body>
</html>
