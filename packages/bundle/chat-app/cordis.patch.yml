# Standalone chat application. Like sdk-minimal, this bundle does not layer
# over dsh-base: this insert is the complete Cordis tree. User profile, home,
# and invocation patches still apply above it.
#
# The goal is the tiniest useful chat surface: no shell, no filesystem, no
# skills, no subagents, no settings surface — one DeepSeek adapter, one tiny
# web_search tool, JSONL sessions, and the minimal web UI. The initial model
# context is exactly one persona line plus the single tool schema.

- insert:
    # The web flag family (--host, --port, --no-open) and its webStartup
    # service, reused from the web-app bundle's startup plugin.
    - id: chat-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3095
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'

    # Durable attachment storage: sniffed images and verbatim files under
    # $DSH_HOME/attachments/v1. Mounting it is what lets the adapter prepare
    # and send multimodal content.
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'
      config:
        dshHome: !!js process.env.DSH_HOME ?? ''

    # Live model-route settings ($DSH_HOME/settings.yaml, hot-reloaded): the
    # chat settings panel writes a `llm-deepseek:` section through this
    # provider, swapping the adapter's base URL at runtime without a restart.
    - id: settings
      name: '@deepseek-ai/dsh-settings-file'

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        # Custom gateways cap output budgets at varying ranges; a lean chat
        # never needs the 256k default, which some backends reject outright.
        maxTokens: 16384
        apiKeyEnv: DEEPSEEK_API_KEY
        # The measured ceiling of the qwen flash gateway (the endpoint reports
        # "maximum context length is 262144 tokens" past it); compaction
        # thresholds derive from this number. DSH_CONTEXT_WINDOW overrides for
        # other endpoints.
        defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 262144)
        streamIdleTimeoutMs: 172800000

    # The minimal agent kernel, explicit like sdk-minimal: every service row
    # is owned here and optional producers it does not use are omitted.
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 6
        fallbackMaxBytes: 48
        maxTitleBytes: 80

    # The persona is the whole system prompt, and it lives in the runtime
    # settings (editable from the panel, persisted under the dsh home). The
    # static prefix stays empty so the glue's dynamic persona section is the
    # single source.
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: ''

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: invariants
      name: '@deepseek-ai/dsh-invariants'

    - id: session-invariant
      name: '@deepseek-ai/dsh-session/invariant'

    - id: agent-invariant
      name: '@deepseek-ai/dsh-agent/invariant'

    - id: scope-invariant
      name: '@deepseek-ai/dsh-scope/invariant'

    - id: agent-loop-invariant
      name: '@deepseek-ai/dsh-agent-loop/invariant'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none

    # Live-preferred listing, cold history reads, and folded titles. The FTS
    # index backs the sidebar's full-text chat search and opens lazily on the
    # first search (in-memory: rebuilt from the JSONL corpus, cheap at this
    # scale).
    - id: session-query
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: first-search

    # Context accounting: one fold per session anchored on the gateway's own
    # per-turn usage, shared by compaction and any pressure-sensitive plugin.
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    # The summarize-and-replace engine behind efficient conversations. Its
    # built-in auto listeners stay off (`auto: false`): the chat glue registers
    # the same triggers itself, gated on the settings panel's auto-compact
    # toggle, and serves /api/sessions/:id/compact via compactNow.
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        auto: false

    # The web seam plus the search engines. The pinned id is the chat-owned
    # `chat-selector`, which dispatches each search to the engine the settings
    # panel chose: the keyless tiny metasearch (default) or the user's own
    # Chrome (logged-in Google/X). DSH_WEB_SEARCH_PROVIDER still pins any
    # registered provider directly (e.g. deepseek-official).
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: !!js process.env.DSH_WEB_SEARCH_PROVIDER ?? 'chat-selector'

    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-search-tiny
      name: '@deepseek-ai/dsh-web-search-tiny'

    # The one model-facing tool: tiny schema, internal question generator,
    # timestamped sources.
    - id: tool-web-search-tiny
      name: '@deepseek-ai/dsh-tool-web-search-tiny'
      config:
        maxResults: 5
        generateQuestion: true

    # Enforce the tool's cooperative timeout budget.
    - id: timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'

    # The chat surface glue: static dist serving, the /api routes, SSE
    # streaming, the URL line, and the default-browser handoff.
    - id: chat-runtime
      name: '@deepseek-ai/dsh-chat-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        provider: !!js process.env.DSH_CHAT_PROVIDER ?? 'deepseek-official'
        model: !!js process.env.DSH_CHAT_MODEL ?? 'deepseek-chat'
        reasoningEffort: !!js (process.env.DSH_CHAT_REASONING || undefined)
        temperature: !!js "process.env.DSH_CHAT_TEMPERATURE ? Number(process.env.DSH_CHAT_TEMPERATURE) : undefined"
        persona: !!js process.env.DSH_CHAT_PERSONA ?? 'You are a helpful assistant.'
        # Which general engine the user-chrome searches run against; Google's
        # personalization is the point in a real logged-in profile, but any
        # OpenAI-gateway style swap (bing, duckduckgo) is one env away.
        chromeWebEngine: !!js process.env.DSH_CHAT_WEB_ENGINE ?? 'google'
